<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label> Enter 1st Number: </label>
    <input type="text" id="num1"> <br>
    <label> Enter 2nd Number:</label>
    <input type="text" id="num2">
    <button id="addBtn"> add</button>
    <h2>Results: <span id="sum"> 0</span></h2>
<script>
        addNumber = () =>
    {
        
        let n1= document.getElementById("num1").value;
        let n2= document.getElementById("num2").value;
        if(n1==="" || n2 === "" || isNaN(n1) || isNaN(n2))
    {
        alert("Enter Valid Numbers");
        document.getElementById("num1").value = "";
       return;
    }

        let res= parseInt(n1) +parseInt(n2);
        document.getElementById("sum").innerHTML= res;
        document.getElementById("num1").value = "";
document.getElementById("num2").value = "";
    }
    document.getElementById("addBtn").addEventListener("click", addNumber);

</script>
</body>
</html>
